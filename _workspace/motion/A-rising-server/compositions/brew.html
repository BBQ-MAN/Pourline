        prevStep = step;
        if (S >= 3 && wt >= 250 && fill250S === null) { fill250S = S; sc250.x = 0.6; sc250.v = 0; }
        const vis = pour && f.x >= 0.3;
        const sw = Math.min(Math.max(1 + 0.5 * f.x, 1), 6);
        if (prevVis && !vis && !pour) { detaches.push({ S, w: frames[i - 1].sw }); tilt.v += SLOSH_V0; }
        prevVis = vis;
        frames[i] = { lvl: lvl.x, f: f.x, phi, tilt: tilt.x, tgt: tgt.x, sc60: sc60.x, sc250: sc250.x, vis, sw, step };
        if (vis) {
          const p0 = psi;
          psi += dt * (0.5 + 0.1 * f.x);
          if (Math.floor(psi) > Math.floor(p0)) emits.push(S, S + 0.4);
        }
        springStep(lvl, hT, 1500, 1.0, dt); // motion.follow
        springStep(f, fIn, 200, 1.0, dt); // motion.calm
        springStep(tilt, 0, 60, 0.35, dt); // motion.slosh
        springStep(tgt, markY(step ? 250 : 60), 300, 0.9, dt); // motion.target
        springStep(sc60, 1, 400, 0.6, dt); // motion.drop
        springStep(sc250, 1, 400, 0.6, dt);
        if (S >= 1.3 && S < 98) phi += dt * TAU * (0.3 + 0.1 * f.x);
      }

      // ---------- 경로 ----------
      const VX = (u) => 92 + 1.76 * u, VY = (v) => 364 + 1.64 * v;
      function vesselPath(closed) {
        const p = new Path2D();
        if (closed) { p.moveTo(VX(11), VY(0)); p.lineTo(VX(89), VY(0)); }
        else p.moveTo(VX(89), VY(0));
        p.bezierCurveTo(VX(95), VY(18), VX(100), VY(42), VX(100), VY(61));
        p.bezierCurveTo(VX(100), VY(83), VX(79), VY(100), VX(50), VY(100));
        p.bezierCurveTo(VX(21), VY(100), VX(0), VY(83), VX(0), VY(61));
        p.bezierCurveTo(VX(0), VY(42), VX(5), VY(18), VX(11), VY(0));
        if (closed) p.closePath();
        return p;
      }
      const VESSEL = vesselPath(true), WALL = vesselPath(false);
      function drop(ctx, cx, cy, s) {
        const k = 0.1 * s, X = (u) => cx + (u - 50) * k, Y = (v) => cy + (v - 70) * k;
        ctx.beginPath();
        ctx.moveTo(X(50), Y(0));
        ctx.bezierCurveTo(X(50), Y(0), X(92), Y(58), X(92), Y(92));
        ctx.bezierCurveTo(X(92), Y(118), X(73), Y(140), X(50), Y(140));
        ctx.bezierCurveTo(X(27), Y(140), X(8), Y(118), X(8), Y(92));
        ctx.bezierCurveTo(X(8), Y(58), X(50), Y(0), X(50), Y(0));
        ctx.closePath();
      }
      const mix = (a, b, p) => {
        const A = a.match(/\w\w/g).map((h) => parseInt(h, 16)), B = b.match(/\w\w/g).map((h) => parseInt(h, 16));
        return "rgb(" + A.map((x, i) => Math.round(x + (B[i] - x) * p)).join(",") + ")";
      };
      const clamp01 = (x) => Math.min(Math.max(x, 0), 1);

      // ---------- 그리기 ----------
      const root = document.querySelector('[data-composition-id="brew"]');
      const $ = (id) => root.querySelector("#" + id);
      const cv = $("b-cv"), ctx = cv.getContext("2d");
      const elW = $("b-wnum"), elT = $("b-time"), elF = $("b-flow");
      const elC1 = $("b-c1"), elC2 = $("b-c2"), elC3 = $("b-c3"), elCard = $("b-card");
      const STEPS = [
        { l1: "1/2 단계 · 60 g까지 · 0:10까지", name: "뜸 60\u00a0g, 30초 기다리기 (95°C, 중간-가는 분쇄)", g: 60 },
        { l1: "2/2 단계 · 250 g까지 · 1:30까지", name: "0:40 나머지 물을 작은 원으로 천천히 250\u00a0g까지", g: 250 },
      ];
      const fmt1 = (x) => (x < 0 ? "−" : "") + Math.abs(x).toFixed(1);
      function fmtTime(S) {
        if (S < 3) return "00:00.0";
        const tt = Math.floor(Math.min(95, S - 3) * 10 + 1e-6) / 10;
        const mm = Math.floor(tt / 60), ss = tt - mm * 60;
        return String(mm).padStart(2, "0") + ":" + ss.toFixed(1).padStart(4, "0");
      }

      function render(v) {
        const S = vToS(v);
        const fr = frames[Math.min(N, Math.max(0, Math.round(S * FPS)))];
        // 숫자 겹
        const wt = weightAt(S);
        elW.textContent = fmt1(wt);
        elT.textContent = fmtTime(S);
        elF.textContent = flowAt(S).toFixed(1);
        const st = STEPS[fr.step];
        elC1.textContent = st.l1;
        elC2.textContent = st.name;
        elC3.textContent = S >= 93 ? "목표 도달 · 무게가 멈추면 끝납니다" : "남은 " + fmt1(Math.max(0, st.g - wt)) + " g · 제때";
        // 카드 색 숨(motion.tint 250 + 350 ms)
        let tint = 0;
        if (fill60S !== null && S >= fill60S) {
          const a = S - fill60S;
          tint = a < 0.25 ? eStd(a / 0.25) : 1 - eStd(clamp01((a - 0.25) / 0.35));
        }
        elCard.style.backgroundColor = mix("#F0E5DF", "#F8DECF", tint);

        // 모양 겹
        ctx.setTransform(2, 0, 0, 2, 0, 0);
        ctx.clearRect(0, 0, 360, 800);
        const h = fr.lvl, ys = levelY(h);
        const Aw = Math.min(5, 0.6 * fr.f), tanT = Math.tan((fr.tilt * Math.PI) / 180);
        const surfY = (x) => ys + Aw * Math.sin((TAU * x) / 72 + fr.phi) + (x - 180) * tanT;
        const hasLiquid = h > 0.001;

        ctx.save();
        ctx.clip(VESSEL);
        if (hasLiquid) {
          ctx.beginPath();
          ctx.moveTo(90, 540);
          for (let x = 90; x <= 270; x += 2) ctx.lineTo(x, surfY(x));
          ctx.lineTo(270, 540);
          ctx.closePath();
          ctx.fillStyle = "#FFDCC4";
          ctx.fill();
        }
        // 현재 단계 목표 수위선(점선, 액체 위·안 모두)
        let tAlpha = fill250S !== null && S >= fill250S ? 1 - clamp01((S - fill250S) / 0.2) : 1;
        if (tAlpha > 0) {
          ctx.globalAlpha = tAlpha;
          ctx.setLineDash([6, 4]);
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = "#52443B";
          ctx.beginPath();
          ctx.moveTo(92, fr.tgt);
          ctx.lineTo(268, fr.tgt);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 1;
        }
        if (hasLiquid) {
          ctx.beginPath();
          for (let x = 90; x <= 270; x += 2) x === 90 ? ctx.moveTo(x, surfY(x)) : ctx.lineTo(x, surfY(x));
          ctx.lineWidth = 2.5;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.strokeStyle = "#6F4A2E";
          ctx.stroke();
        }
        // 물줄기가 수면에 닿는 점의 작은 물결(반지름 3 dp에서 커지며 사라짐)
        const hitY = hasLiquid ? surfY(180) : 528;
        ctx.lineWidth = 1.5;
        for (let i = 0; i < emits.length; i++) {
          const a = S - emits[i];
          if (a < 0 || a >= 0.6) continue;
          const p = a / 0.6;
          ctx.globalAlpha = 0.4 * (1 - p);
          ctx.strokeStyle = "#6F4A2E";
          ctx.beginPath();
          ctx.arc(180, hitY, 3 + 7 * eRipple(p), 0, TAU);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        // 영점 확인 물방울(1.16 s 낙하 → 1.48 s 바닥 물결 고리)
        ring(ctx, S - 1.48, 180, 524, 40, 0.25);
        // 붓기 멈춤: 물줄기가 떨어져 물방울 → 수면에 고리(반지름 24 dp)
        for (const d of detaches) {
          const a = S - d.S;
          if (a >= 0.32) ring(ctx, a - 0.32, 180, hitY, 24, 0.25);
        }
        ctx.restore();

        // 벽(위가 열린 서버). 자동 완료 때 outline → primary 300 ms
        const wallP = S >= 98 ? eStd(clamp01((S - 98) / 0.3)) : 0;
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.strokeStyle = mix("#847469", "#6F4A2E", wallP);
        ctx.stroke(WALL);

        // 물줄기
        ctx.strokeStyle = "#6F4A2E";
        ctx.fillStyle = "#6F4A2E";
        if (fr.vis) {
          ctx.lineWidth = fr.sw;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(180, 352);
          ctx.lineTo(180, hitY);
          ctx.stroke();
        }
        for (const d of detaches) {
          const a = S - d.S;
          if (a < 0 || a >= 0.32) continue;
          const yd = 352 + 7 + (hitY - 7 - 359) * eFall(a / 0.32);
          ctx.lineWidth = d.w;
          ctx.beginPath();
          ctx.moveTo(180, yd);
          ctx.lineTo(180, hitY);
          ctx.stroke();
          drop(ctx, 180, yd, 1);
          ctx.fill();
        }
        if (S >= 1.16 && S < 1.48) {
          drop(ctx, 180, 364 + (517 - 364) * eFall((S - 1.16) / 0.32), 1);
          ctx.fill();
        }

        // 단계 물방울 표식(속 빈 = 아직, 채움 = 도달)
        marker(ctx, markY(60), fill60S !== null && S >= fill60S, fr.sc60);
        marker(ctx, markY(250), fill250S !== null && S >= fill250S, fr.sc250);

        // 자동 완료 물결 고리(서버 중심, 반지름 0 → 140 dp)
        if (S >= 98) {
          const p = clamp01((S - 98) / 0.9);
          if (p < 1) {
            ctx.globalAlpha = 0.6 * (1 - p);
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#6F4A2E";
            ctx.beginPath();
            ctx.arc(180, 446, 140 * eRipple(p), 0, TAU);
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
        }
      }
      // 납작한 물결 고리: 가로 반지름 0 → R, 세로 = 가로 × ratio, 알파 0.6 → 0, motion.ripple 900 ms
      function ring(ctx, a, cx, cy, R, ratio) {
        if (a < 0 || a >= 0.9) return;
        const p = a / 0.9, rx = Math.max(0.01, R * eRipple(p));
        ctx.globalAlpha = 0.6 * (1 - p);
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#6F4A2E";
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, rx * ratio, 0, 0, TAU);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      function marker(ctx, y, filled, s) {
        if (filled) {
          drop(ctx, 281, y, s);
          ctx.fillStyle = "#2F6A5A";
          ctx.fill();
        } else {
          drop(ctx, 281, y, 1);
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = "#52443B";
          ctx.stroke();
        }
      }

      // ---------- 타임라인 ----------
      const tl = gsap.timeline({ paused: true });
      const proxy = { v: 0 };
      tl.fromTo(proxy, { v: 0 }, { v: 20.05, duration: 20.05, ease: "none", onUpdate: () => render(proxy.v) }, 0);
      // 영점 탭: M3 리플 + 진행 원(아이콘 자리)
      tl.fromTo("#b-zripple", { scale: 0 }, { scale: 1, duration: 0.25, ease: "power2.out" }, 1.0);
      tl.set("#b-zripple", { opacity: 0.12 }, 1.0);
      tl.fromTo("#b-zripple", { opacity: 0.12 }, { opacity: 0, duration: 0.15, ease: "none", immediateRender: false }, 1.14);
      tl.fromTo("#b-spin-r", { rotation: 0 }, { rotation: 200, duration: 0.16, ease: "none", transformOrigin: "50% 50%" }, 1.0);
      // 19.90 s 화면 전환 fadeOut 150 ms
      tl.fromTo("#b-fade", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "none" }, 19.9);
      render(0);
      window.__timelines["brew"] = tl;
    })();
  </script>
</template>
