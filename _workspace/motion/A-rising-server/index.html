<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1600" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 720px;
        height: 1600px;
        overflow: hidden;
        background: #fff8f5;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #fff8f5;
      }
    </style>
  </head>
  <body>
    <!-- 시안 A "차오르는 서버": S1 추출(0–20.05 s) → S6 추출 요약(20.05–21 s). 360×800 dp를 2배(720×1600 px)로 그린다 -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="21"
      data-fps="60"
      data-width="720"
      data-height="1600"
    >
      <div
        id="brew"
        data-composition-id="brew"
        data-composition-src="compositions/brew.html"
        data-start="0"
        data-duration="20.05"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="720"
        data-height="1600"
      ></div>
      <div
        id="summary"
        data-composition-id="summary"
        data-composition-src="compositions/summary.html"
        data-start="20.05"
        data-duration="0.95"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="720"
        data-height="1600"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
