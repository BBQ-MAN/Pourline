[versions]
agp = "9.4.0"
kotlin = "2.4.21"
ksp = "2.3.12"
composeBom = "2026.09.00"
room = "2.8.5"
navigationCompose = "2.10.2"
navigationevent = "1.2.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
androidxCore = "1.18.0"
coroutines = "1.11.0"
serializationJson = "1.12.0"
turbine = "1.2.1"
robolectric = "4.17"
roborazzi = "1.77.0"
junit = "4.13.2"
testRunner = "1.7.0"
